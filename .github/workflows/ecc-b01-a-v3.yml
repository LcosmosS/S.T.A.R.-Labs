name: ECC-B01 Investigator A v3 fixture verification

on:
  pull_request:
    paths:
      - 'ecc_b01/**'
      - 'tests/test_ecc_b01_a_c03_v3.py'
      - '.github/workflows/ecc-b01-a-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a-v3-conformant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository-compatible pinned dependencies
        run: |
          python -m pip install numpy==1.26.4 scipy==1.17.0 sympy==1.14.0 pytest==9.0.2
          python -m pip check
      - name: Run isolated v3 regression and fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p a_v3_ci_evidence
          python -m pytest -q tests/test_ecc_b01_a_c03_v3.py 2>&1 | tee a_v3_ci_evidence/pytest.log
          python ecc_b01/investigator_a_v3.py a_v3_ci_evidence/results.json 2>&1 | tee a_v3_ci_evidence/runner.log
          python -m pip freeze > a_v3_ci_evidence/pip-freeze.txt
          python - <<'PY'
          import hashlib, json, pathlib
          import numpy
          root = pathlib.Path('a_v3_ci_evidence')
          report = json.loads((root/'results.json').read_text())
          assert numpy.__version__ == '1.26.4'
          assert report['status'] == 'PASS' and len(report['results']) == 16
          source = pathlib.Path('ecc_b01/investigator_a_v3.py')
          assert report['source_sha256'] == hashlib.sha256(source.read_bytes()).hexdigest()
          fixtures = {v['fixture_id']: v for v in report['results']}
          assert fixtures['C-03']['pass_'] and fixtures['C-03-NEG']['pass_']
          (root/'source_sha256.txt').write_text(report['source_sha256']+'\n')
          PY
          (cd a_v3_ci_evidence && sha256sum results.json runner.log pytest.log pip-freeze.txt source_sha256.txt > SHA256SUMS)
      - name: Upload CI-only v3 evidence (not investigator attestation)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecc-b01-a-v3-ci-evidence
          path: a_v3_ci_evidence/
          if-no-files-found: warn
