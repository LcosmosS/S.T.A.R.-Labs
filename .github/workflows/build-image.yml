name: Build Sage Image

on:
  pull_request:
    branches: [ main ]
    paths:
      - docker/Dockerfile
      - requirements.txt
      - pyproject.toml
      - setup.py
      - "src/**"
      - .github/workflows/build-image.yml
  push:
    branches: [ main ]
    paths:
      - docker/Dockerfile
      - requirements.txt
      - pyproject.toml
      - setup.py
      - "src/**"
      - .github/workflows/build-image.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/lcosmoss/star-sage:latest
            ghcr.io/lcosmoss/star-sage:${{ github.sha }}
