name: Build Sage Image

on:
  pull_request:
    branches: [ main ]
    paths:
      - docker/Dockerfile
      - requirements.txt
      - pyproject.toml
      - setup.py
      - "src/**"
      - .github/workflows/build-image.yml
  push:
    branches: [ main ]
    paths:
      - docker/Dockerfile
      - requirements.txt
      - pyproject.toml
      - setup.py
      - "src/**"
      - .github/workflows/build-image.yml

permissions:
  contents: read

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: ghcr.io/lcosmoss/star-sage:pr-${{ github.event.pull_request.number }}

  publish-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: star-sage-main-publish
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable commit image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/lcosmoss/star-sage:${{ github.sha }}

      - name: Advance latest only if this SHA is still main
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(
            git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main |
              awk '{print $1}'
          )"
          if [[ -z "$current_main" ]]; then
            echo "Unable to resolve current main SHA; refusing to update latest." >&2
            exit 1
          fi
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "Skipping latest: $GITHUB_SHA is stale; current main is $current_main."
            exit 0
          fi
          docker buildx imagetools create             --tag ghcr.io/lcosmoss/star-sage:latest             ghcr.io/lcosmoss/star-sage:${GITHUB_SHA}
