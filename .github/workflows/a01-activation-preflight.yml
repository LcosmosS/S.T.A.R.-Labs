name: A01 source-locked activation preflight

on:
  pull_request:
    paths:
      - ".gitmodules"
      - "requirements.txt"
      - "pyproject.toml"
      - "registry/experiment_registry_v0.2.csv"
      - "registry/dataset_registry_v0.1.csv"
      - "registry/data_provenance_registry_v0.1.csv"
      - "registry/parameter_registry_v0.1.csv"
      - "registry/null_model_registry_v0.1.csv"
      - "preregistrations/EXP-MAP-A01/**"
      - "controlled_execution/specs/EXP-MAP-A01.json"
      - "controlled_execution/EXP-MAP-A01_ACTIVATION_DECISION.md"
      - "data/raw/ci_subset.csv"
      - "scripts/validate_audit_registries.py"
      - "scripts/validate_exp_map_a01_preregistration.py"
      - "scripts/check_controlled_readiness.py"
      - "src/control/**"
      - "src/data/cremona_ecdata.py"
      - "src/experiments/exp_map_a01.py"
      - "tests/test_exp_map_a01_preregistration.py"
      - "web_tool/src/lib/star/registry-snapshot.json"
      - ".github/workflows/a01-activation-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a01-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
          lfs: false
      - name: Hydrate exact pinned arithmetic source bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/ecdata/allcurves
          curl --fail --location --retry 3 --retry-all-errors \
            --output data/ecdata/allcurves/allcurves.00000-09999 \
            https://raw.githubusercontent.com/JohnCremona/ecdata/25cec5ecfec8b9f016eb1631ac633194c2bed39f/allcurves/allcurves.00000-09999
      - uses: ./.github/actions/hydrate-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pip install -e . --no-deps
      - name: Verify upstream ecdata gitlink and exact source bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-tree HEAD data/ecdata | awk '{print $3}')" = "25cec5ecfec8b9f016eb1631ac633194c2bed39f"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          path=Path("data/ecdata/allcurves/allcurves.00000-09999")
          assert hashlib.sha256(path.read_bytes()).hexdigest()=="259f3846329395b371e8079c77a6f1097adaebc98a054974573e241416efa968"
          assert sum(1 for _ in path.open(encoding="utf-8")) == 64687
          PY
      - name: Validate registry and activation-only regression
        run: |
          python scripts/validate_exp_map_a01_preregistration.py
          python scripts/validate_audit_registries.py
          python scripts/check_controlled_readiness.py --require-ready
          python -m pytest -q tests/test_exp_map_a01_preregistration.py
      - name: Controlled runner preflight (never run inference in this PR)
        run: star-controlled-experiment preflight --spec controlled_execution/specs/EXP-MAP-A01.json
