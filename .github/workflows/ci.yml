name: S.T.A.R. CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: pytest -q

  registry-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate registry tables
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          root = Path("registry")
          required = ["claim_evidence_v0.2.csv", "claim_experiment_crosswalk_v0.2.csv", "experiment_registry_v0.2.csv"]
          for name in required:
              assert (root / name).exists(), f"missing registry: {name}"
          def rows(name):
              with (root / name).open(newline="", encoding="utf-8") as f:
                  return list(csv.DictReader(f))
          claims = {r["Claim_ID"] for r in rows("claim_evidence_v0.2.csv")}
          experiments = rows("experiment_registry_v0.2.csv")
          ids = [r["Experiment_ID"] for r in experiments]
          assert len(ids) == len(set(ids)), "duplicate Experiment_ID"
          for r in experiments:
              for cid in r["Claim_IDs"].split(";"):
                  assert cid in claims, f"unknown Claim_ID: {cid}"
          exp_ids = set(ids)
          for r in rows("claim_experiment_crosswalk_v0.2.csv"):
              assert r["Claim_ID"] in claims
              assert r["Experiment_ID"] in exp_ids
          print(f"validated {len(claims)} claims, {len(experiments)} experiments")
          PY

  arithmetic-smoke:
    runs-on: ubuntu-latest
    container:
      image: sagemath/sagemath:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install dependencies
        run: sage -python -m pip install -r requirements.txt
      - name: Projection smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          sage -python - <<'PY'
          import numpy as np
          from src.acsc.projection import project
          coords = project([{"delta": -11, "conductor": 11, "rank": 0}])
          assert coords.shape == (1, 3) and np.isfinite(coords).all()
          print("projection smoke test passed")
          PY

  ci-artifact:
    runs-on: ubuntu-latest
    needs: [unit-tests, registry-validation, arithmetic-smoke]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build CI metadata artifact
        run: |
          mkdir -p results
          printf 'ci_commit,%s\n' '${{ github.sha }}' > results/ci_metadata.csv
      - uses: actions/upload-artifact@v4
        with:
          name: ci-metadata
          path: results/ci_metadata.csv
          retention-days: 7
