name: Controlled Notebooks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "notebooks/**"
      - "src/**"
      - "registry/**"
      - ".github/workflows/notebooks.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    container:
      image: sagemath/sagemath:latest
      options: --user root --memory=8g
    steps:
      - name: Install Git
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Install notebook dependencies
        run: |
          sage -python -m pip install --upgrade pip
          sage -python -m pip install -r requirements.txt
          sage -python -m pip install nbconvert nbclient ipykernel
      - name: Validate controlled notebooks
        run: |
          sage -python - <<'PY'
          from pathlib import Path
          import json
          notebooks = sorted(Path("notebooks").glob("*.ipynb"))
          assert notebooks, "no controlled notebooks found"
          for p in notebooks:
              assert p.stat().st_size > 100, f"empty or placeholder notebook: {p}"
              nb = json.loads(p.read_text(encoding="utf-8"))
              assert nb.get("nbformat", 0) >= 4, f"invalid notebook: {p}"
          print(f"validated {len(notebooks)} controlled notebooks")
          PY