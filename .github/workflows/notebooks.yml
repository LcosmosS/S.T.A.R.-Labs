name: Controlled Notebooks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "notebooks/**"
      - "src/**"
      - "registry/**"
      - "requirements.txt"
      - ".github/workflows/notebooks.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    container:
      image: sagemath/sagemath:latest
      options: --user root --memory=8g
    steps:
      - name: Install Git
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Install notebook dependencies
        run: |
          sage -python -m pip install --upgrade pip
          sage -python -m pip install -r requirements.txt
          sage -python -m pip install nbconvert nbclient ipykernel
      - name: Execute controlled notebooks
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        shell: bash
        run: |
          set -euo pipefail
          expected="
          notebooks/00_registry_overview.ipynb
          notebooks/01_preprocessing.ipynb
          notebooks/02_arithmetic_reconstruction.ipynb
          notebooks/03_mapping_benchmark.ipynb
          notebooks/04_rank_environment.ipynb
          notebooks/05_rank_topology.ipynb
          notebooks/06_null_models.ipynb
          notebooks/07_sfr_prediction.ipynb
          notebooks/08_robustness.ipynb
          "
          for nb in $expected; do
            test -s "$nb"
            sage -python -m jupyter nbconvert --to notebook --execute "$nb"               --output "/tmp/$(basename "$nb")"               --ExecutePreprocessor.timeout=300               --ExecutePreprocessor.kernel_name=python3
          done
          sage -python - <<'PY'
          from pathlib import Path
          expected = {
              "00_registry_overview.ipynb",
              "01_preprocessing.ipynb",
              "02_arithmetic_reconstruction.ipynb",
              "03_mapping_benchmark.ipynb",
              "04_rank_environment.ipynb",
              "05_rank_topology.ipynb",
              "06_null_models.ipynb",
              "07_sfr_prediction.ipynb",
              "08_robustness.ipynb",
          }
          actual = {p.name for p in Path("notebooks").glob("*.ipynb")}
          assert actual == expected, f"controlled notebook set mismatch: {sorted(actual ^ expected)}"
          PY
          echo "executed all canonical controlled notebooks"
