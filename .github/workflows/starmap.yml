name: STARMAP prototype
on:
  pull_request:
    paths: ['web_tool/**', 'registry/**', 'preregistrations/**', 'controlled_execution/specs/**', '.github/workflows/starmap.yml', '.vercelignore']
  push:
    branches: [main, prototype/starmap]
    paths: ['web_tool/**', 'registry/**', 'preregistrations/**', 'controlled_execution/specs/**', '.github/workflows/starmap.yml', '.vercelignore']
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_tool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web_tool/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - name: Install Chromium for research registry browser regression
        run: npx playwright install --with-deps chromium
      - name: Test research registry at desktop/mobile widths
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 8081 > "$RUNNER_TEMP/starmap-preview.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:8081/registry > /dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then cat "$RUNNER_TEMP/starmap-preview.log"; exit 1; fi
          npm run research:browser-smoke -- http://127.0.0.1:8081
