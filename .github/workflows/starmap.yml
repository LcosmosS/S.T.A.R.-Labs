name: STARMAP prototype
on:
  pull_request:
    paths: ['web_tool/**', 'registry/**', 'preregistrations/**', 'controlled_execution/specs/**', '.github/workflows/starmap.yml', '.vercelignore']
  push:
    branches: [main, prototype/starmap]
    paths: ['web_tool/**', 'registry/**', 'preregistrations/**', 'controlled_execution/specs/**', '.github/workflows/starmap.yml', '.vercelignore']
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_tool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web_tool/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - name: Install Chromium for research content browser smoke
        run: npx playwright install --with-deps chromium
      - name: Test /research in desktop and mobile browsers
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 8081 >/tmp/starmap-research-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 50); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8081/research; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/starmap-research-preview.log
            exit 1
          fi
          node scripts/research-browser-smoke.mjs http://127.0.0.1:8081
