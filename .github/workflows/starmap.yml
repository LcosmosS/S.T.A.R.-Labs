name: STARMAP prototype
# Every repository change can affect an admitted release through data, tools,
# provenance, receipt, dependencies or build output. Never skip this gate via
# an incomplete paths filter, including changes confined to Git LFS pointers.
on:
  pull_request:
  push:
    branches: [main, prototype/starmap]
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_tool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web_tool/package-lock.json
      - run: npm ci
      - name: Hydrate locked ALFALFA publisher bytes only when display admission is proposed
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          # The production sky gate must validate hydrated bytes, never an
          # unhydrated Git LFS pointer. Pending review creates no activation.
          if node -e 'const m=require("./web_tool/content/sky-overlay-releases.v1.json"); process.exit(m.sources.some(s=>s.datasetId==="DATA-VIZIER-ALFALFA100")?0:1)'; then
            FILE="data/intake/vizier/alfalfa100/2026-10-09-cds-corrected-2019/table2.vot"
            git lfs fetch --include="$FILE" origin "$GITHUB_SHA"
            git lfs checkout -- "$FILE"
            echo "654217f9b3414856c1a8b09071c81eb834a0b0fbc6ec3aea9777e01fdaea1079  $FILE" | sha256sum -c -
          fi
      - run: npm test
      - name: Verify source-hydrated admitted release receipt and bytes
        run: npm run sky:check
      - run: npm run build
      - run: npm run typecheck
      - name: Install Chromium for research content browser smoke
        run: npx playwright install --with-deps chromium
      - name: Test /research in desktop and mobile browsers
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 8081 >/tmp/starmap-research-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 50); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8081/research; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/starmap-research-preview.log
            exit 1
          fi
          node scripts/research-browser-smoke.mjs http://127.0.0.1:8081
          node scripts/sky-browser-smoke.mjs http://127.0.0.1:8081
          node scripts/a01-browser-smoke.mjs http://127.0.0.1:8081
