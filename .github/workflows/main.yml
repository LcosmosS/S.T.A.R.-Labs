        run: |
          set -euo pipefail
          mkdir -p data/provenance/raw
          manifest=data/provenance/google_docs_manifest.csv
          printf 'document_index,document_id,source_url,output_path\n' > "$manifest"
          index=0
          while IFS= read -r doc_id; do
            [[ -z "$doc_id" ]] && continue
            index=$((index + 1))
            output="data/provenance/raw/doc_$(printf '%03d' "$index")_${doc_id}.txt"
            url="https://docs.google.com/document/d/${doc_id}/export?format=txt"
            echo "Downloading Google Doc ${index}: ${doc_id}"
            curl --fail --location --silent --show-error --retry 3 \
              --connect-timeout 15 --max-time 60 \
              "$url" --output "$output"
            test -s "$output"
            printf '%s,%s,%s,%s\n' \
              "$index" "$doc_id" \
              "https://docs.google.com/document/d/${doc_id}/edit?usp=sharing" \
              "$output" >> "$manifest"
          done <<< "$DOC_IDS"
          echo "Downloaded $index Google Docs."
          wc -l "$manifest"

      - name: Commit changed provenance files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/provenance/
          if git diff --cached --quiet; then
            echo "No provenance changes detected."
            exit 0
          fi
          git commit -m "chore: sync Google Docs provenance sources"
          git push
