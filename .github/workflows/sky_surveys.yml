name: Sky Survey Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sky-survey-smoke:
    runs-on: ubuntu-latest
    container:
      image: sagemath/sagemath:latest
      options: --user root
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate Python project root
        id: root
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          for input in requirements.txt pyproject.toml ci_diagnostics/diagnose_cosmology.py src/tests/test_load_sky_surveys.py src/data/sky_survey_dataset_builder.py; do
            test -f "$ROOT/$input" || { echo "Missing Python project input: $ROOT/$input" >&2; exit 1; }
          done
          echo "ROOT=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Detected project root: $ROOT"

      - name: Install dependencies
        run: |
          cd "${{ steps.root.outputs.ROOT }}"
          sage -python -m pip install -r requirements.txt
          sage -python -m pip install -e . --no-deps

      - name: Install Parquet engine for the Sage Python interpreter
        run: |
          set -euo pipefail
          # The Sage container has no ensurepip/python3-venv. Installing pip
          # packages globally may use a different site-packages directory.
          # Install the wheel at a known location and explicitly import it
          # using the SAME Sage interpreter that runs the survey builder.
          sage -python -m pip install --no-deps --target /tmp/star-sky-pyarrow pyarrow==21.0.0
          sage -python - <<'PY'
          import sys
          sys.path.insert(0, "/tmp/star-sky-pyarrow")
          import pandas
          import pyarrow
          print("Sage Python Parquet engine:", pyarrow.__version__, "pandas:", pandas.__version__)
          PY

      - name: Run cosmology diagnostics
        run: |
          set -euo pipefail
          cd "${{ steps.root.outputs.ROOT }}"
          sage -python ci_diagnostics/diagnose_cosmology.py | tee ci_diagnostics/output.txt

      - name: Validate sky survey loader
        run: |
          cd "${{ steps.root.outputs.ROOT }}"
          sage -python -m pytest -q src/tests/test_load_sky_surveys.py

      - name: Run dataset union builder (downsampled)
        run: |
          set -euo pipefail
          cd "${{ steps.root.outputs.ROOT }}"
          sage -python - <<'PY'
          import sys
          sys.path.insert(0, "/tmp/star-sky-pyarrow")
          from pathlib import Path
          import pandas as pd
          from src.data.sky_survey_dataset_builder import SkySurveyUnionBuilder

          output = Path("sky_surveys_ci.parquet")
          builder = SkySurveyUnionBuilder(downsample=200)
          expected = builder.build()
          builder.save(output)
          assert output.is_file() and output.stat().st_size > 0, "Parquet output missing"
          restored = pd.read_parquet(output)
          pd.testing.assert_frame_equal(restored, expected, check_dtype=True)
          assert len(restored) <= 400, "downsampled union exceeded input bound"
          print(f"Parquet union round-trip passed: {len(restored)} rows")
          PY
