name: Sky Survey Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sky-survey-smoke:
    runs-on: ubuntu-latest
    container:
      image: sagemath/sagemath:latest
      options: --user root
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Detect project root
        id: root
        run: |
          set -euo pipefail
          ROOT=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type d -name src -printf '%h\n' | head -n 1)
          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Detected project root: $ROOT"

      - name: Install dependencies
        run: |
          cd "${{ steps.root.outputs.ROOT }}"
          sage -python -m pip install -r requirements.txt
          sage -python -m pip install pyarrow
          sage -python -m pip install -e . --no-deps

      - name: Run cosmology diagnostics
        run: |
          set -euo pipefail
          cd "${{ steps.root.outputs.ROOT }}"
          sage -python ci_diagnostics/diagnose_cosmology.py | tee ci_diagnostics/output.txt

      - name: Validate sky survey loader
        run: |
          cd "${{ steps.root.outputs.ROOT }}"
          sage -python -m pytest -q src/tests/test_load_sky_surveys.py

      - name: Run dataset union builder (downsampled)
        run: |
          cd "${{ steps.root.outputs.ROOT }}"
          sage -python - <<'PY'
          from src.data.sky_survey_dataset_builder import SkySurveyUnionBuilder
          builder = SkySurveyUnionBuilder(downsample=200)
          builder.save("sky_surveys_ci.parquet")
          PY
